# Shamflare production stack: Caddy (HTTPS) → Next.js + Django → PostgreSQL.
# Usage: cp .env.example .env  (fill it in)  →  docker compose up -d --build
# See README.md → "Deployment" for the full checklist.

name: shamflare

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published ports: PostgreSQL is reachable only on the internal network.
    networks: [data]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN},backend,localhost
      CSRF_TRUSTED_ORIGINS: https://${SITE_DOMAIN}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      NUM_PROXIES: "1"
    volumes:
      # Uploads persist outside the image. Static files ship inside the image (WhiteNoise).
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [data, web]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        BACKEND_INTERNAL_URL: http://backend:8000
        MEDIA_INTERNAL_URL: http://caddy:8080
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      MEDIA_INTERNAL_URL: http://caddy:8080
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    depends_on:
      - frontend
      - backend
    networks: [web]

networks:
  # Only the backend can talk to the database; this network has no outside access.
  data:
    internal: true
  web: {}

volumes:
  postgres_data:
  media:
  caddy_data:
  caddy_config:
